; PlatformIO config for vMix M5Stick-C Tally Light
; Two envs:
;   [env:wokwi]  — builds for the Wokwi ESP32 simulator with a shimmed M5 library
;   [env:device] — builds the real firmware for an original M5StickC (C_PLUS=0)

[platformio]
default_envs = wokwi
src_dir = src/a_GLOBAL

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; ----------------------------------------------------------------------------
; SIMULATOR BUILD
; ----------------------------------------------------------------------------
[env:wokwi]
build_src_filter =
    +<*>
    -<plugins/>
    +<../../sim/sim_glue.cpp>
build_flags =
    -I sim
    -DSIM_WOKWI=1
    -DC_PLUS=0
    -DUSER_SETUP_LOADED=1
    -include sim/User_Setup.h
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    fastled/FastLED@3.6.0
    https://github.com/poelstra/arduino-multi-button.git

; ----------------------------------------------------------------------------
; DEVICE BUILD (original M5StickC v1)
; ----------------------------------------------------------------------------
[env:device]
upload_speed = 115200
build_src_filter =
    +<*>
build_flags =
    -DC_PLUS=0
lib_extra_dirs = libs
lib_deps =
    fastled/FastLED@3.6.0

; ----------------------------------------------------------------------------
; DEVICE BUILD — M5StickC Plus2 (ESP32-PICO-V3-02, AXP2101, ST7789 135x240)
; ----------------------------------------------------------------------------
[env:device_plus2]
upload_speed = 115200
build_src_filter =
    +<*>
build_flags =
    -DC_PLUS=2
lib_extra_dirs = libs
lib_deps =
    fastled/FastLED@3.6.0
    m5stack/M5Unified@0.1.17
    m5stack/M5GFX@0.1.16
