; PlatformIO config for the BRONTIDE vMix tally — Waveshare ESP32-C6-LCD-1.47 fork.
;
; Single env. The M5StickC v1 / Plus2 builds and the Wokwi sim live on the
; master / plus2 branches; this branch is C6-only on purpose.

[platformio]
default_envs = c6
src_dir = src/c6

[env:c6]
; pioarduino fork — required for Arduino-ESP32 3.x, which is what supports
; the ESP32-C6. The vendor platform-espressif32 still ships Arduino 2.x and
; rejects this board with "doesn't support arduino framework".
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_C6=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    fastled/FastLED@3.7.8
    moononournation/GFX Library for Arduino@^1.4.7
    bitbank2/JPEGDEC@^1.6.1
